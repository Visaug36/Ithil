name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest stable Xcode with this major version on the runner. Keep in step with the
  # maintainer's Xcode (see CLAUDE.md).
  XCODE_MAJOR: "26"

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | grep -vi beta | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Lint (swift-format)
        run: |
          paths="Ithil IthilCore IthilCoreTests"
          if ! xcrun swift-format lint --strict --recursive --parallel $paths; then
            echo "::group::Patch that swift-format would apply"
            xcrun swift-format format --in-place --recursive --parallel $paths
            git --no-pager diff
            echo "::endgroup::"
            exit 1
          fi

      - name: Test (Debug)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Ithil.xcodeproj -scheme Ithil -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee build/test.log
          grep -E "Test run with|tests? (passed|failed)|Executed [0-9]+ test" build/test.log || true
          echo "Files changed by the build (e.g. String Catalog sync):"
          git status --porcelain

      - name: Check the String Catalog
        run: scripts/check-strings.sh build/DerivedData

      - name: Show test failures
        if: failure()
        run: |
          [ -d build/TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult --compact \
            | python3 -c '
          import json, sys
          def walk(node, path):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print("FAIL", " / ".join(path), "::", name)
              for child in node.get("children", []):
                  walk(child, path + [name] if node.get("nodeType") in ("Test Case", "Test Suite") else path)
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root, [])
          '

      - name: Archive Release (universal, as the release workflow does)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Ithil.xcodeproj -scheme Ithil -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/Ithil.xcarchive \
            ONLY_ACTIVE_ARCH=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            2>&1 | tee build/release.log
          app=build/Ithil.xcarchive/Products/Applications/Ithil.app
          archs=$(lipo -archs "$app/Contents/MacOS/Ithil")
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/Ithil.zip
          ls -l build/Ithil.zip

      - name: Check for warnings
        run: scripts/check-warnings.sh build/test.log build/release.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/*.log
          if-no-files-found: ignore
