name: Release

# Builds a universal Release of Ithil when a vX.Y.Z tag is pushed and publishes it as a GitHub Release.
# The tag can also come from GitHub's Releases page ("Draft a new release", a new vX.Y.Z tag on main, Publish):
# then the build and the CHANGELOG notes are added to that release.
# Ad-hoc signed by default. When the Developer ID secrets below are set, the app is signed with Developer ID,
# notarized and stapled instead (see docs/RELEASE_CHECKLIST.md, "Signing and notarization").
#
#   DEVELOPER_ID_CERTIFICATE_P12   base64 of a "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD
#   APPLE_TEAM_ID                  10-character team ID
#   NOTARY_APPLE_ID                Apple ID email used for notarization
#   NOTARY_APP_PASSWORD            app-specific password for that Apple ID

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A release published on the Releases page (its new tag may also start a push run; see concurrency).
  release:
    types: [published]

permissions:
  contents: write

# One run per tag: when a Releases-page release starts both a push and a release run, the newer one wins.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  XCODE_MAJOR: "26"

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | grep -vi beta | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Read version from tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CERTIFICATE_P12:-}" || -z "${TEAM_ID:-}" ]]; then
            echo "No Developer ID secrets: the release will be ad-hoc signed."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build universal Release
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing=(CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual)
          if [[ "${{ steps.signing.outputs.mode }}" == "developer-id" ]]; then
            signing=(CODE_SIGN_IDENTITY="Developer ID Application" CODE_SIGN_STYLE=Manual
                     DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          fi
          xcodebuild archive \
            -project Ithil.xcodeproj -scheme Ithil -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Ithil.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${signing[@]}"
          app=build/Ithil.xcarchive/Products/Applications/Ithil.app
          lipo -archs "$app/Contents/MacOS/Ithil"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p build/release
          cp -R "$app" build/release/

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/release/Ithil.app build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple build/release/Ithil.app
          xcrun stapler validate build/release/Ithil.app

      - name: Zip with ditto and checksum
        id: package
        run: |
          set -euo pipefail
          name="Ithil-${{ steps.version.outputs.version }}.zip"
          (cd build/release && ditto -c -k --sequesterRsrc --keepParent Ithil.app "$name")
          (cd build/release && shasum -a 256 "$name" > "$name.sha256")
          cat "build/release/$name.sha256"
          echo "zip=build/release/$name" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/release/notes.md
          if [[ "${{ steps.signing.outputs.mode }}" != "developer-id" ]]; then
            {
              echo
              echo "_This build isn't notarized. On first launch, open **System Settings → Privacy & Security**"
              echo "and click **Open Anyway** next to the message about Ithil._"
            } >> build/release/notes.md
          fi
          cat build/release/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="${{ steps.package.outputs.zip }}"
          title="Ithil ${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published on the Releases page, which made the tag: add the files and the CHANGELOG notes to it.
            gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file build/release/notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
              --title "$title" \
              --notes-file build/release/notes.md \
              --verify-tag
          fi

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
