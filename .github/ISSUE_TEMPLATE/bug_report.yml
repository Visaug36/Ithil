name: Bug report
description: Something in Ithil doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If it's a security problem, please don't file it here; see
        [SECURITY.md](https://github.com/Visaug36/Ithil/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a weekly event on Tuesday at 14:00
        2. Drag a PDF onto it
        3. …
    validations:
      required: true
  - type: input
    id: ithil-version
    attributes:
      label: Ithil version
      description: Ithil → About Ithil.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description:  → About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
  - type: dropdown
    id: appearance
    attributes:
      label: Appearance
      options:
        - Night
        - Dawn
        - Match System
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Screenshots or a screen recording help a lot. Please leave out anything private: event titles, file names
        or your folder's contents.
